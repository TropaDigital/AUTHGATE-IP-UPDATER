name: Diagnosticar atualização Windows
on:
  push:
    paths: ['.github/workflows/diagnose-update.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar versão instalada sem login
        shell: pwsh
        run: |
          $release = Invoke-RestMethod 'https://api.github.com/repos/TropaDigital/AUTHGATE-IP-UPDATER/releases/latest'
          $env:EXPECTED_UPDATE_VERSION = $release.tag_name.TrimStart('v')
          ./scripts/test-auto-update.ps1
